<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🧠 Reading Challenge | ReadQuest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div class="top-banner">

🧠 Reading Challenge

</div>

<section class="py-5">

<div class="container">

<div class="card shadow-lg border-0 rounded-5">

<div class="card-body p-5">

<div class="text-center">

<h2 id="quizTitle"></h2>

<p id="questionCounter"></p>

</div>

<div class="progress mb-4" style="height:25px;">

<div
id="progressBar"
class="progress-bar progress-bar-striped progress-bar-animated bg-success"
style="width:0%;">

0%

</div>

</div>

<h4 id="questionText" class="mb-4"></h4>

<div id="choices" class="d-grid gap-3">

</div>

<div class="text-center mt-4">

<button
id="nextBtn"
class="btn btn-primary"
disabled>

Next →

</button>

</div>

</div>

</div>

</div>

</section>

<script src="assets/js/stories.js"></script>
<script src="assets/js/quiz.js"></script>

</body>

</html>
